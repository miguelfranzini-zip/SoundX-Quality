<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo fone Bluetooth — SoundX Quality</title>
  <link rel="icon" type="image/png" href="assets/logo/4.png">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=garet@400,600,700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Muli:wght@300;400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <script>if(localStorage.getItem('sxq_sidebar_collapsed')==='true')document.documentElement.classList.add('sxq-collapsed');</script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="overlay" id="overlay"></div>

    <div class="app-main">
      <header class="topbar" id="topbar"></header>

      <main class="content">
        <div class="content__inner">
          <div class="page-header">
            <div>
              <h1>Cadastrar Fone de Ouvido</h1>
              <p>Registre um novo fone de ouvido no sistema.</p>
            </div>
            <button class="btn btn--ghost" id="btn-voltar">Voltar para Fones</button>
          </div>

          <div class="card">
            <div class="card__title">
              <h2>Dados do dispositivo</h2>
            </div>

            <form class="form" id="form-fone" novalidate>
              <div class="form__grid">
                <div class="form__grupo">
                  <label class="form__label" for="numero_serie">
                    Número de série *
                    <span class="tooltip-hint" data-tooltip="Identificador alfanumérico único gravado no fone ou código de barras da embalagem (ex: SX-2026-0001)." title="Código serial único do dispositivo." tabindex="0">!</span>
                  </label>
                  <input class="form__controle" type="text" id="numero_serie" name="numero_serie" placeholder="Ex.: SX-2026-0001" required>
                </div>

                <div class="form__grupo">
                  <label class="form__label" for="modelo">
                    Modelo *
                    <span class="tooltip-hint" data-tooltip="Nome comercial da linha SoundX (ex: SoundX Pro, SoundX Studio, Bass Max)." title="Modelo comercial do fone." tabindex="0">!</span>
                  </label>
                  <input class="form__controle" type="text" id="modelo" name="modelo" placeholder="Ex.: SoundX Pro" required>
                </div>

                <div class="form__grupo">
                  <label class="form__label" for="marca">
                    Marca
                    <span class="tooltip-hint" data-tooltip="Fabricante oficial do equipamento (padrão: SoundX)." title="Fabricante do fone." tabindex="0">!</span>
                  </label>
                  <input class="form__controle" type="text" id="marca" name="marca" placeholder="SoundX">
                </div>

                <div class="form__grupo">
                  <label class="form__label" for="lote">
                    Lote de produção *
                    <span class="tooltip-hint" data-tooltip="Código da remessa fabril para rastreabilidade de qualidade e auditoria (ex: LT-2026-A)." title="Lote de produção para rastreabilidade." tabindex="0">!</span>
                  </label>
                  <input class="form__controle" type="text" id="lote" name="lote" placeholder="Ex.: LT-2026-A" value="LT-2026-A" required>
                </div>

                <div class="form__grupo">
                  <label class="form__label" for="tipo_conexao">
                    Tipo de conexão
                    <span class="tooltip-hint" data-tooltip="Interface física ou protocolo sem fio de conexão do fone." title="Tipo de conexão do fone." tabindex="0">!</span>
                  </label>
                  <select class="form__controle" id="tipo_conexao" name="tipo_conexao">
                    <option value="Bluetooth">Bluetooth</option>
                    <option value="USB-C">USB-C</option>
                    <option value="Cabo">Cabo</option>
                    <option value="Wireless 2.4GHz">Wireless 2.4GHz</option>
                  </select>
                </div>

                <div class="form__grupo">
                  <label class="form__label" for="data_fabricacao">
                    Data de fabricação
                    <span class="tooltip-hint" data-tooltip="Data em que o fone concluiu a montagem na fábrica." title="Data de montagem do fone." tabindex="0">!</span>
                  </label>
                  <input class="form__controle" type="date" id="data_fabricacao" name="data_fabricacao">
                </div>

                <div class="form__grupo">
                  <label class="form__label" for="status">
                    Status inicial
                    <span class="tooltip-hint" data-tooltip="Situação de entrada na esteira. Por padrão, unidades recém-fabricadas entram como 'Aguardando inspeção'." title="Situação de entrada na fábrica." tabindex="0">!</span>
                  </label>
                  <select class="form__controle" id="status" name="status">
                    <option value="Aguardando inspeção">Aguardando inspeção</option>
                    <option value="Em inspeção">Em inspeção</option>
                    <option value="Aprovado">Aprovado</option>
                    <option value="Reprovado / Manutenção">Reprovado / Manutenção</option>
                    <option value="Em manutenção">Em manutenção</option>
                  </select>
                </div>
              </div>

              <div id="alerta-form" class="alerta alerta--erro hidden" role="alert"></div>

              <div class="toolbar">
                <button type="submit" class="btn btn--primario" id="btn-salvar">Salvar Fone</button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <!-- Configuração de ambiente (gerado no build do Netlify) -->
  <script src="js/env-config.js"></script>
  <script type="module" src="js/pages/fone-cadastro.js"></script>
</body>
</html>
