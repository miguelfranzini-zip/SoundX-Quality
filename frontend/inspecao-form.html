<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Inspeção — SoundX Quality</title>
  <link rel="icon" type="image/png" href="assets/logo/4.png">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=garet@400,600,700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Muli:wght@300;400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css?v=3">
  <script>if(localStorage.getItem('sxq_sidebar_collapsed')==='true')document.documentElement.classList.add('sxq-collapsed');</script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="overlay" id="overlay"></div>

    <div class="app-main">
      <header class="topbar" id="topbar"></header>

      <main class="content">
        <div class="content__inner">
          <div class="page-header">
            <div>
              <h1>Registrar Inspeção</h1>
              <p>Registre o resultado da inspeção de um fone.</p>
            </div>
            <button class="btn btn--ghost" id="btn-voltar">Voltar para Inspeções</button>
          </div>

          <div class="card">
            <div class="card__title">
              <h2>Resultado da inspeção</h2>
            </div>

            <form class="form" id="form-inspecao" novalidate>
              <div class="form__grid">
                <div class="form__grupo">
                  <label class="form__label" for="id_fone">
                    Fone *
                    <span class="tooltip-hint" data-tooltip="Selecione o fone cadastrado a ser inspecionado (identificado por número de série e modelo)." title="Selecione o fone de ouvido para inspeção." tabindex="0">!</span>
                  </label>
                  <select class="form__controle" id="id_fone" name="id_fone" required>
                    <option value="">Carregando fones...</option>
                  </select>
                </div>

                <div class="form__grupo">
                  <label class="form__label" for="resultado_final">
                    Resultado final *
                    <span class="tooltip-hint" data-tooltip="'Aprovado' libera o fone para expedição. 'Reprovado / Manutenção' abre automaticamente uma Ordem de Serviço na fila dos técnicos." title="Parecer final da inspeção de qualidade." tabindex="0">!</span>
                  </label>
                  <select class="form__controle" id="resultado_final" name="resultado_final" required>
                    <option value="Aprovado">Aprovado</option>
                    <option value="Reprovado / Manutenção">Reprovado / Manutenção</option>
                  </select>
                </div>
              </div>

              <div class="form__grupo">
                <label class="form__label" for="foto_url">
                  Link da Foto / Evidência (opcional)
                  <span class="tooltip-hint" data-tooltip="URL direta de uma imagem (HTTP/HTTPS) documentando o teste ou a avaria identificada." title="Link de imagem da evidência do teste." tabindex="0">!</span>
                </label>
                <input
                  class="form__controle"
                  type="url"
                  id="foto_url"
                  name="foto_url"
                  placeholder="https://exemplo.com/evidencia.jpg ou caminho da imagem"
                >
              </div>

              <!-- Checklist Técnico Integrado -->
              <div class="card mt-4" style="background: var(--bg-suave); border: 1px solid var(--borda);">
                <div class="card__title">
                  <h3 style="font-size: 1.05rem; margin-bottom: var(--space-2);">Checklist Técnico de Qualidade</h3>
                  <p class="muted" style="font-size: 0.85rem;">Avalie os itens fundamentais durante o teste físico:</p>
                </div>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--space-3); margin-top: var(--space-3);">
                  <div class="form__grupo">
                    <label class="form__label" for="chk_audio">
                      1. Áudio L/R (Frequência)
                      <span class="tooltip-hint" data-tooltip="Verifique equilíbrio de canais esquerdo/direito, ausência de chiados e resposta sonora clara." title="Avaliação dos alto-falantes e estéreo." tabindex="0">!</span>
                    </label>
                    <select class="form__controle" id="chk_audio">
                      <option value="Passou">Passou (Sem ruído/distorção)</option>
                      <option value="Não passou">Não passou (Falha/Mudo)</option>
                    </select>
                  </div>

                  <div class="form__grupo">
                    <label class="form__label" for="chk_mic">
                      2. Microfone & Ruído
                      <span class="tooltip-hint" data-tooltip="Avalie clareza na captação de voz e redução de interferências sonoras externas." title="Avaliação do microfone embutido." tabindex="0">!</span>
                    </label>
                    <select class="form__controle" id="chk_mic">
                      <option value="Passou">Passou (Captação nítida)</option>
                      <option value="Não passou">Não passou (Ruído/Chiado)</option>
                    </select>
                  </div>

                  <div class="form__grupo">
                    <label class="form__label" for="chk_conexao">
                      3. Conectividade / Pareamento
                      <span class="tooltip-hint" data-tooltip="Avalie estabilidade do pareamento Bluetooth sem cortes ou integridade do conector físico." title="Avaliação do sinal Bluetooth ou conector." tabindex="0">!</span>
                    </label>
                    <select class="form__controle" id="chk_conexao">
                      <option value="Passou">Passou (Estável)</option>
                      <option value="Não passou">Não passou (Queda/Intermitente)</option>
                    </select>
                  </div>

                  <div class="form__grupo">
                    <label class="form__label" for="chk_bateria">
                      4. Bateria & Consumo
                      <span class="tooltip-hint" data-tooltip="Avalie retenção de energia, resposta do circuito de carga e temperatura do aparelho." title="Avaliação da bateria e circuito de alimentação." tabindex="0">!</span>
                    </label>
                    <select class="form__controle" id="chk_bateria">
                      <option value="Passou">Passou (Tensão normal)</option>
                      <option value="Não passou">Não passou (Perda de carga)</option>
                    </select>
                  </div>
                </div>
              </div>

              <div class="form__grupo mt-4">
                <label class="form__label" for="observacao">
                  Observação Técnica
                  <span class="tooltip-hint" data-tooltip="Anotações complementares do laudo de qualidade, detalhes de falhas acústicas ou notas de reteste." title="Observações complementares do inspetor." tabindex="0">!</span>
                </label>
                <textarea
                  class="form__controle"
                  id="observacao"
                  name="observacao"
                  placeholder="Descreva evidências, falhas ou observações sobre o checklist..."
                ></textarea>
              </div>

              <div id="alerta-form" class="alerta alerta--erro hidden" role="alert"></div>

              <div class="toolbar">
                <button type="submit" class="btn btn--primario" id="btn-salvar">Registrar Inspeção</button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <!-- Configuração de ambiente (gerado no build do Netlify) -->
  <script src="js/env-config.js"></script>
  <script type="module" src="js/pages/inspecao-form.js"></script>
</body>
</html>
