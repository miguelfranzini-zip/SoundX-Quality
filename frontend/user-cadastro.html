<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Usuário — SoundX Quality</title>
  <link rel="icon" type="image/png" href="assets/logo/4.png">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=garet@400,600,700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Muli:wght@300;400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css?v=2">
  <link rel="stylesheet" href="css/components.css?v=2">
  <script>if(localStorage.getItem('sxq_sidebar_collapsed')==='true')document.documentElement.classList.add('sxq-collapsed');</script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="overlay" id="overlay"></div>

    <div class="app-main">
      <header class="topbar" id="topbar"></header>

      <main class="content">
        <div class="content__inner">
          <div class="page-header">
            <div>
              <h1>Cadastrar Usuário</h1>
              <p>Registre um novo usuário com acesso ao sistema.</p>
            </div>
            <button class="btn btn--ghost" id="btn-voltar">Voltar</button>
          </div>

          <div class="card">
            <div class="card__title">
              <h2>Dados do Novo Usuário</h2>
            </div>

            <form class="form" id="form-user" novalidate>
              <div class="form__grid">
                <div class="form__grupo">
                  <label class="form__label" for="nome">
                    Nome completo *
                    <span class="tooltip-hint" data-tooltip="Digite o nome completo do funcionário para identificação nos laudos de qualidade." title="Digite o nome completo do funcionário." tabindex="0">!</span>
                  </label>
                  <input class="form__controle" type="text" id="nome" name="nome"
                    placeholder="Ex: João da Silva" required autocomplete="name">
                </div>

                <div class="form__grupo">
                  <label class="form__label" for="email">
                    E-mail *
                    <span class="tooltip-hint" data-tooltip="E-mail de acesso corporativo ou pessoal que será usado para login no sistema." title="E-mail de acesso ao sistema." tabindex="0">!</span>
                  </label>
                  <input class="form__controle" type="email" id="email" name="email"
                    placeholder="email@empresa.com" required autocomplete="email">
                </div>

                <div class="form__grupo">
                  <label class="form__label" for="senha">
                    Senha *
                    <span class="tooltip-hint" data-tooltip="Senha inicial com no mínimo 6 caracteres. O usuário poderá alterá-la futuramente na tela de perfil." title="Senha inicial (mínimo 6 caracteres)." tabindex="0">!</span>
                  </label>
                  <input class="form__controle" type="password" id="senha" name="senha"
                    placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
                </div>

                <div class="form__grupo">
                  <label class="form__label" for="cargo">
                    Cargo / Perfil *
                    <span class="tooltip-hint" data-tooltip="Perfil operacional: Inspetor (laudos e testes), Técnico (manutenção e reparo), Gerente (auditoria e relatórios) ou Admin (gestão total)." title="Selecione o perfil de acesso do usuário." tabindex="0">!</span>
                  </label>
                  <select class="form__controle" id="cargo" name="cargo" required>
                    <option value="" disabled selected>Selecione um cargo</option>
                    <option value="Inspetor">Inspetor de Qualidade</option>
                    <option value="Técnico">Técnico de Manutenção</option>
                    <option value="Gerente">Gerente de Qualidade</option>
                    <option value="Admin">Administrador</option>
                  </select>
                </div>

                <div class="form__grupo">
                  <label class="form__label" for="cpf">
                    CPF <span style="font-weight:400;color:var(--text-secundario)">(opcional)</span>
                    <span class="tooltip-hint" data-tooltip="Cadastro de Pessoa Física para registro oficial do operador (formato: 000.000.000-00)." title="CPF do colaborador (opcional)." tabindex="0">!</span>
                  </label>
                  <input class="form__controle" type="text" id="cpf" name="cpf"
                    placeholder="000.000.000-00" maxlength="14" autocomplete="off">
                </div>
              </div>

              <div id="alerta-form" class="alerta alerta--erro hidden" role="alert"></div>

              <div class="toolbar">
                <button type="submit" class="btn btn--primario" id="btn-salvar">Cadastrar Usuário</button>
              </div>
            </form>
          </div>

          <!-- Tabela de usuários cadastrados -->
          <div class="card" style="margin-top: var(--space-6);">
            <div class="card__title">
              <h2>Usuários Cadastrados</h2>
            </div>
            <div id="tabela-usuarios-wrapper">
              <p class="muted">Carregando...</p>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <!-- Configuração de ambiente (gerado no build do Netlify) -->
  <script src="js/env-config.js"></script>
  <script type="module" src="js/pages/user-cadastro.js"></script>
</body>
</html>
